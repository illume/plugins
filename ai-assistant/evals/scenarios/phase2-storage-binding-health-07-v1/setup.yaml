apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: archive
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: archive-consumer
spec:
  containers:
    - name: pause
      image: registry.k8s.io/pause:3.10
      volumeMounts:
        - name: archive
          mountPath: /archive
  volumes:
    - name: archive
      persistentVolumeClaim:
        claimName: archive

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: draft-distractor-1
  labels:
    evals.headlamp.dev/variant: phase2-storage-binding-health-07-v1
data:
  note: "Benign qualification distractor 1 for phase2-storage-binding-health-07-v1"
