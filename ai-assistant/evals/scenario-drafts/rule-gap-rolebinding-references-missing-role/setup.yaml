apiVersion: v1
kind: ServiceAccount
metadata:
  name: bound-account
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: missing-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: missing-role
subjects:
  - kind: ServiceAccount
    name: bound-account
