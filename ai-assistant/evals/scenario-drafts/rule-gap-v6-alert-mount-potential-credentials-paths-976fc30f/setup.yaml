apiVersion: apps/v1
kind: Deployment
metadata:
  name: credential-mount
  labels:
    app: credential-mount
spec:
  replicas: 1
  selector:
    matchLabels:
      app: credential-mount
  template:
    metadata:
      labels:
        app: credential-mount
    spec:
      volumes:
        - name: host-credentials
          hostPath:
            path: /var/lib/kubelet/pki
            type: Directory
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 65532
          volumeMounts:
            - name: host-credentials
              mountPath: /host-pki
              readOnly: true
