scenario_id: core-service-selector-fault-v1
scenario_version: '1.0.0'
family: service-discovery
mode: diagnose_only
title: Service selector does not match any running Pod
description: >
  A Service named "web" exists alongside a Running Pod labeled app=web, but the
  Service's selector requires tier=frontend while the Pod is labeled
  tier=backend, so the EndpointSlice has zero addresses. The candidate must
  diagnose the selector mismatch using only observations it actually
  retrieves.
