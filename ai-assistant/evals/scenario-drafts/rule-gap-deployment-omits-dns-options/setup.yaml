apiVersion: apps/v1
kind: Deployment
metadata:
  name: dns-options-missing
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dns-options-missing
  template:
    metadata:
      labels:
        app: dns-options-missing
    spec:
      dnsPolicy: ClusterFirst
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
