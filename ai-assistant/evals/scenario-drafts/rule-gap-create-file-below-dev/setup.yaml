apiVersion: batch/v1
kind: Job
metadata:
  name: create-file-below-dev
  labels:
    evals.kubernetes.io/bounded-action: 'true'
spec:
  activeDeadlineSeconds: 120
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: create-file-below-dev
    spec:
      restartPolicy: Never
      containers:
        - name: action
          image: registry.k8s.io/e2e-test-images/busybox:1.29-4
          command:
            - /bin/sh
            - '-ceu'
            - >-
              printf controlled > /dev/fixture/created-file; stat -c "%n %s"
              /dev/fixture/created-file
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: fixture
              mountPath: /fixture
            - name: device-fixture
              mountPath: /dev/fixture
      volumes:
        - name: fixture
          emptyDir:
            sizeLimit: 16Mi
        - name: device-fixture
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
