apiVersion: autoscaling/v2beta1
kind: HorizontalPodAutoscaler
metadata:
  name: legacy-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 5
---
apiVersion: autoscaling/v2beta2
kind: HorizontalPodAutoscalerList
metadata:
  resourceVersion: fixture-1
items:
  - apiVersion: autoscaling/v2beta2
    kind: HorizontalPodAutoscaler
    metadata:
      name: legacy-worker
    spec:
      scaleTargetRef:
        apiVersion: apps/v1
        kind: Deployment
        name: worker
      minReplicas: 2
      maxReplicas: 5
