apiVersion: apps/v1
kind: Deployment
metadata:
  name: object-finding-19
spec:
  replicas: 1
  selector:
    matchLabels:
      app: object-finding-19
  template:
    metadata:
      labels:
        app: object-finding-19
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          readinessProbe:
            httpGet:
              path: /ready
              port: http
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 64Mi
