apiVersion: batch/v1
kind: Job
metadata:
  name: oom-worker
spec:
  activeDeadlineSeconds: 120
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: oom-worker
    spec:
      restartPolicy: Never
      containers:
        - name: allocator
          image: busybox:1.36.1
          command:
            - /bin/sh
            - '-c'
            - awk 'BEGIN { value="x"; while (1) value=value value }'
          resources:
            requests:
              memory: 16Mi
            limits:
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
