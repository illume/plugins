apiVersion: apps/v1
kind: Deployment
metadata:
  name: privileged-port
spec:
  replicas: 2
  selector:
    matchLabels:
      app: privileged-port
  template:
    metadata:
      labels:
        app: privileged-port
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
          ports:
            - name: web
              containerPort: 80
