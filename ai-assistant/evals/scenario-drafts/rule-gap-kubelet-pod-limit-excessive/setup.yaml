apiVersion: v1
kind: ConfigMap
metadata:
  name: kubelet-pod-limit-config
  labels:
    evals.kubernetes.io/fixture-kind: node-log-or-config
  annotations:
    evals.kubernetes.io/adapter: normalized-node-predicate
    evals.kubernetes.io/source-path: /var/lib/kubelet/config.yaml
    evals.kubernetes.io/apply-to-current-host: 'false'
data:
  component-config.yaml: |
    apiVersion: kubelet.config.k8s.io/v1beta1
    kind: KubeletConfiguration
    maxPods: 250
  predicate.json: '{"path":"maxPods","operator":"greaterThan","value":110}'
  healthy-control.yaml: |
    apiVersion: kubelet.config.k8s.io/v1beta1
    kind: KubeletConfiguration
    maxPods: 110
