title: Symlink Exchange Can Allow Host Filesystem Access
description: >-
  A user may be able to create a container with subPath volume mounts to access files & directories
  outside of the volume, including on the host filesystem. This was affected at the following
  versions: v1.22.0 - v1.22.1, v1.21.0 - v1.21.4, v1.20.0 - v1.20.10, version v1.19.14 and lower.
  The fixture preserves inert, typed evidence for review without mutating a host, cloud, or runtime
  control-plane surface.
