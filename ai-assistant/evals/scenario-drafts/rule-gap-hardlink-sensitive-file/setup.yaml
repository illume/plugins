apiVersion: batch/v1
kind: Job
metadata:
  name: hardlink-sensitive-file
  labels:
    evals.kubernetes.io/bounded-action: 'true'
spec:
  activeDeadlineSeconds: 120
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: hardlink-sensitive-file
    spec:
      restartPolicy: Never
      containers:
        - name: action
          image: registry.k8s.io/e2e-test-images/busybox:1.29-4
          command:
            - /bin/sh
            - '-ceu'
            - >-
              printf credential > /fixture/shadow; ln /fixture/shadow /fixture/shadow-link; stat -c
              "%i" /fixture/shadow /fixture/shadow-link
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: fixture
              mountPath: /fixture
            - name: device-fixture
              mountPath: /dev/fixture
      volumes:
        - name: fixture
          emptyDir:
            sizeLimit: 16Mi
        - name: device-fixture
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
