apiVersion: v1
kind: Pod
metadata:
  name: pod-fsgroup-is-root
  labels:
    app: pod-fsgroup-is-root
spec:
  securityContext:
    fsGroup: 0
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 65532
