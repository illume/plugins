apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: route-a
spec:
  rules:
    - host: duplicate.example.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-a
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: route-b
spec:
  rules:
    - host: duplicate.example.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-b
                port:
                  number: 80
