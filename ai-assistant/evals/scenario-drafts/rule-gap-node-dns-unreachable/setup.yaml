apiVersion: batch/v1
kind: Job
metadata:
  name: dns-reachability-probe
spec:
  activeDeadlineSeconds: 120
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: dns-reachability-probe
    spec:
      restartPolicy: Never
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 192.0.2.53
        options:
          - name: ndots
            value: '1'
          - name: timeout
            value: '1'
          - name: attempts
            value: '1'
      containers:
        - name: probe
          image: busybox:1.36.1
          command:
            - /bin/sh
            - '-c'
            - >-
              mkdir -p /tmp/www; echo ok > /tmp/www/health; httpd -p 8080 -h /tmp/www; wget -q -T 2
              -O /dev/null http://127.0.0.1:8080/health && echo 'control address reachable';
              nslookup kubernetes.default.svc.cluster.local && exit 0; echo 'dns resolver
              unreachable while control address reachable'; exit 50
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
