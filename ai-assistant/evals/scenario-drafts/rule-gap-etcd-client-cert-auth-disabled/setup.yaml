apiVersion: v1
kind: ConfigMap
metadata:
  name: etcd-client-cert-auth-disabled-fixture
  labels:
    evals.kubernetes.io/fixture-kind: component-configuration
  annotations:
    evals.kubernetes.io/adapter: disposable-node
    evals.kubernetes.io/target-path: /etc/kubernetes/manifests/etcd.yaml
    evals.kubernetes.io/apply-to-current-host: 'false'
data:
  etcd.yaml: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: etcd
      namespace: kube-system
    spec:
      hostNetwork: true
      containers:
        - name: etcd
          image: registry.k8s.io/etcd:3.5.15-0
          command:
            - etcd
            - --listen-client-urls=https://127.0.0.1:2379
            - --trusted-ca-file=/etc/kubernetes/pki/etcd/ca.crt
            - --cert-file=/etc/kubernetes/pki/etcd/server.crt
            - --key-file=/etc/kubernetes/pki/etcd/server.key
            - --client-cert-auth=false
