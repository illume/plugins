apiVersion: apps/v1
kind: Deployment
metadata:
  name: cap-app
  labels:
    app: cap-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cap-app
  template:
    metadata:
      labels:
        app: cap-app
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              add:
                - SYS_ADMIN
                - NET_RAW
              drop: []
