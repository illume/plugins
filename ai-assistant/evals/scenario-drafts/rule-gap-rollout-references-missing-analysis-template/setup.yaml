apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: analysis-rollout
spec:
  replicas: 2
  selector:
    matchLabels:
      app: analysis-rollout
  template:
    metadata:
      labels:
        app: analysis-rollout
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
  strategy:
    canary:
      analysis:
        templates:
          - templateName: missing-analysis
