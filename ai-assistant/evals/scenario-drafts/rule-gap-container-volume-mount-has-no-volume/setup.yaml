apiVersion: v1
kind: Pod
metadata:
  name: orphan-volume-mount
  labels:
    app: orphan-volume-mount
spec:
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 65532
      volumeMounts:
        - name: missing-volume
          mountPath: /data
  volumes: []
