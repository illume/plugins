apiVersion: v1
kind: Service
metadata:
  name: stateful-address
spec:
  clusterIP: 10.96.0.44
  selector:
    app: stateful-address
  ports:
    - name: peer
      port: 7000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stateful-address
spec:
  serviceName: stateful-address
  replicas: 2
  selector:
    matchLabels:
      app: stateful-address
  template:
    metadata:
      labels:
        app: stateful-address
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
