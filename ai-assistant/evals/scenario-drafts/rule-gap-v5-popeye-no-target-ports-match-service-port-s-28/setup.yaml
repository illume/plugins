apiVersion: v1
kind: Service
metadata:
  name: object-finding-28
spec:
  selector:
    app: object-finding-28
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: object-finding-28
spec:
  replicas: 1
  selector:
    matchLabels:
      app: object-finding-28
  template:
    metadata:
      labels:
        app: object-finding-28
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          ports:
            - name: web
              containerPort: 9090
