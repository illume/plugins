apiVersion: v1
kind: ConfigMap
metadata:
  name: image-policy
data:
  allowedImageRegistries: registry.k8s.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  labels:
    app: app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: app
    spec:
      containers:
        - name: app
          image: docker.io/library/nginx:1.27.4
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
