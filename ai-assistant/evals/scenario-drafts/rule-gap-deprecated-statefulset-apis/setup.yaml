apiVersion: apps/v1beta1
kind: StatefulSet
metadata:
  name: legacy-db-v1beta1
spec:
  serviceName: legacy-db
  replicas: 2
  selector:
    matchLabels:
      app: legacy-db-v1beta1
  template:
    metadata:
      labels:
        app: legacy-db-v1beta1
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
---
apiVersion: apps/v1beta2
kind: StatefulSet
metadata:
  name: legacy-db-v1beta2
spec:
  serviceName: legacy-db
  replicas: 2
  selector:
    matchLabels:
      app: legacy-db-v1beta2
  template:
    metadata:
      labels:
        app: legacy-db-v1beta2
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
