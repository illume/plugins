apiVersion: v1
kind: Service
metadata:
  name: not-ready-db
spec:
  clusterIP: None
  selector:
    app: not-ready-db
  ports:
    - name: db
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: not-ready-db
spec:
  serviceName: not-ready-db
  replicas: 2
  selector:
    matchLabels:
      app: not-ready-db
  template:
    metadata:
      labels:
        app: not-ready-db
    spec:
      containers:
        - name: db
          image: registry.k8s.io/pause:3.10
          readinessProbe:
            tcpSocket:
              port: 5432
            periodSeconds: 2
            failureThreshold: 1
