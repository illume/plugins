apiVersion: v1
kind: Pod
metadata:
  name: web-1
  labels:
    app: web
    tier: backend
spec:
  containers:
    - name: web
      image: nginx:1.25
status:
  phase: Running
  podIP: 10.0.0.11
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: web
    tier: frontend
  ports:
    - port: 80
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reporter
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: reporter-reader
rules:
  - apiGroups:
      - ''
    resources:
      - configmaps
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: reporter-reader
subjects:
  - kind: ServiceAccount
    name: reporter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: reporter-reader
