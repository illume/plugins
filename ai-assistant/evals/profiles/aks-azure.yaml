schema_version: '1.0.0'
profile_name: aks
cluster:
  kind: aks
  # The caller provisions a dedicated non-production cluster and supplies an
  # explicit kubeconfig. The eval runner never provisions Azure resources.
  credential_env_vars:
    - AZURE_SUBSCRIPTION_ID
    - AZURE_TENANT_ID
    - AKS_KUBECONFIG_PATH
model:
  kind: azure
  credential_env_vars:
    - HEADLAMP_AI_PROVIDER
    - HEADLAMP_AI_API_KEY
    - HEADLAMP_AI_ENDPOINT
    - HEADLAMP_AI_DEPLOYMENT_NAME
    - HEADLAMP_AI_MODEL
