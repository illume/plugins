apiVersion: v1
kind: Pod
metadata:
  name: pod-supplemental-group-is-root
  labels:
    app: pod-supplemental-group-is-root
spec:
  securityContext:
    supplementalGroups:
      - 0
      - 65532
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 65532
