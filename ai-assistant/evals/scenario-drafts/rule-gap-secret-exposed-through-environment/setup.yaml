apiVersion: v1
kind: Secret
metadata:
  name: application-credential
stringData:
  token: fixture-token
---
apiVersion: v1
kind: Pod
metadata:
  name: environment-secret-consumer
  labels:
    app: environment-secret-consumer
spec:
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 65532
      env:
        - name: APPLICATION_TOKEN
          valueFrom:
            secretKeyRef:
              name: application-credential
              key: token
