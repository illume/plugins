apiVersion: v1
kind: Pod
metadata:
  name: orphan-priority-workload
  labels:
    app: orphan-priority-workload
spec:
  priorityClassName: missing-workload-priority
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 65532
