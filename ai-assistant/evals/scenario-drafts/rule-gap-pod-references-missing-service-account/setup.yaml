apiVersion: v1
kind: Pod
metadata:
  name: missing-account-workload
  labels:
    app: missing-account-workload
spec:
  serviceAccountName: missing-workload-account
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 65532
