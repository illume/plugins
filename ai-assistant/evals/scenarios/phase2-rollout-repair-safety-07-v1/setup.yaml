apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-hog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cpu-hog
  template:
    metadata:
      labels:
        app: cpu-hog
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 1M
              memory: 16Mi

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: draft-distractor-1
  labels:
    evals.headlamp.dev/variant: phase2-rollout-repair-safety-07-v1
data:
  note: "Benign qualification distractor 1 for phase2-rollout-repair-safety-07-v1"
