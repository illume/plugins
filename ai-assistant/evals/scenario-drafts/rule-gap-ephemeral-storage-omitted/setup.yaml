apiVersion: v1
kind: Pod
metadata:
  name: ephemeral-storage-omitted
  labels:
    app: ephemeral-storage-omitted
spec:
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 65532
      resources:
        requests:
          cpu: 100m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 32Mi
