apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: underhealthy-pdb
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: underhealthy
---
apiVersion: v1
kind: Pod
metadata:
  name: underhealthy-ready
  labels:
    app: underhealthy
spec:
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 65532
---
apiVersion: v1
kind: Pod
metadata:
  name: underhealthy-failed
  labels:
    app: underhealthy
spec:
  restartPolicy: Never
  containers:
    - name: app
      image: registry.k8s.io/e2e-test-images/busybox:1.29-4
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 65532
      command:
        - /bin/sh
        - '-c'
        - exit 1
