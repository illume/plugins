apiVersion: v1
kind: Pod
metadata:
  name: object-finding-36-client
  labels:
    app: client
spec:
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10
status:
  podIP: 192.0.2.10
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: object-finding-36
spec:
  podSelector:
    matchLabels:
      app: client
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 192.0.2.0/24
            except:
              - 192.0.2.128/25
