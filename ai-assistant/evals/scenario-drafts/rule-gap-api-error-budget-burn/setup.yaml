apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: burnprobes.burn.telemetry.example
spec:
  group: burn.telemetry.example
  scope: Namespaced
  names:
    plural: burnprobes
    singular: burnprobe
    kind: BurnProbe
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              x-kubernetes-preserve-unknown-fields: true
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: burn-telemetry-failure
webhooks:
  - name: burn.telemetry.example
    admissionReviewVersions:
      - v1
    sideEffects: None
    failurePolicy: Fail
    timeoutSeconds: 2
    clientConfig:
      service:
        namespace: __EVAL_NAMESPACE__
        name: absent-webhook
        path: /validate
        port: 443
    rules:
      - apiGroups:
          - burn.telemetry.example
        apiVersions:
          - v1alpha1
        operations:
          - CREATE
        resources:
          - burnprobes
        scope: Namespaced
