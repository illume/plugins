apiVersion: v1
kind: ConfigMap
metadata:
  name: event-rate-limit-admission-missing-fixture
  labels:
    evals.kubernetes.io/fixture-kind: component-configuration
  annotations:
    evals.kubernetes.io/adapter: disposable-node
    evals.kubernetes.io/target-path: /etc/kubernetes/manifests/kube-apiserver.yaml
    evals.kubernetes.io/apply-to-current-host: 'false'
data:
  kube-apiserver.yaml: |
    apiVersion: v1
    kind: Pod
    metadata:
      name: kube-apiserver
      namespace: kube-system
    spec:
      hostNetwork: true
      containers:
        - name: kube-apiserver
          image: registry.k8s.io/kube-apiserver:v1.31.1
          command:
            - kube-apiserver
            - --secure-port=6443
            - --authorization-mode=Node,RBAC
            - --enable-admission-plugins=NamespaceLifecycle,ServiceAccount,NodeRestriction
  event-rate-limit.yaml: |
    apiVersion: eventratelimit.admission.k8s.io/v1alpha1
    kind: Configuration
    limits:
      - type: Namespace
        qps: 50
        burst: 100
