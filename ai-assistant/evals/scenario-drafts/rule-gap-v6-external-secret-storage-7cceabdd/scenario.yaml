scenario_version: 0.1.0
family: rule-gap-policy
mode: diagnose_only
title: Application stores a database password directly in a Secret
description: >-
  Consider the use of an external secrets storage and management system, instead of using Kubernetes
  Secrets directly, if you have more complex secret management needs. Ensure the solution requires
  authentication to access secrets, has auditing of access to and use of secrets, and encrypts
  secrets. Some solutions also make it easier to rotate secrets. The workload relies on a namespace
  Secret rather than an external secret manager.
