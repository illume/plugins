apiVersion: v1
kind: Service
metadata:
  name: object-finding-25
spec:
  selector:
    app: object-finding-25
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: object-finding-25
spec:
  replicas: 1
  selector:
    matchLabels:
      app: object-finding-25
  template:
    metadata:
      labels:
        app: object-finding-25
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 65532
