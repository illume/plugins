schema_version: '1.0.0'
scenario_id: core-unschedulable-capacity-v1
scenario_version: '1.0.0'
family: scheduling
mode: diagnose_only
title: Pod requests more CPU than any eligible node can provide
description: >
  A single Pod requests 8 CPU while the only eligible Node's allocatable
  capacity is 4 CPU, so the real scheduler cannot place it. Scored truth
  depends on an actual scheduler decision, which the simulated in-memory
  adapter cannot independently prove (see contracts/kwok-compatibility.ts);
  this scenario is declared for the `aks` profile only until a real local
  Minikube adapter is qualified in a later phase.
