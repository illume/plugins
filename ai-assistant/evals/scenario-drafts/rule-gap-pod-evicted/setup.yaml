apiVersion: v1
kind: Pod
metadata:
  name: storage-pressure
  labels:
    app: storage-pressure
spec:
  restartPolicy: Never
  containers:
    - name: writer
      image: registry.k8s.io/e2e-test-images/busybox:1.29-4
      command:
        - /bin/sh
        - '-c'
        - dd if=/dev/zero of=/scratch/fill bs=1M count=32; sleep 3600
      resources:
        requests:
          ephemeral-storage: 1Mi
        limits:
          ephemeral-storage: 4Mi
      volumeMounts:
        - name: scratch
          mountPath: /scratch
  volumes:
    - name: scratch
      emptyDir: {}
