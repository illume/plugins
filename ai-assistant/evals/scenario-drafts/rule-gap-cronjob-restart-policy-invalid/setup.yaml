apiVersion: batch/v1
kind: CronJob
metadata:
  name: invalid-restart-cronjob
spec:
  schedule: 0 * * * *
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Always
          containers:
            - name: app
              image: registry.k8s.io/pause:3.10
              securityContext:
                allowPrivilegeEscalation: false
                runAsNonRoot: true
                runAsUser: 65532
