apiVersion: apps/v1
kind: Deployment
metadata:
  name: legacy-service-account
spec:
  replicas: 2
  selector:
    matchLabels:
      app: legacy-service-account
  template:
    metadata:
      labels:
        app: legacy-service-account
    spec:
      serviceAccount: workload-identity
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
