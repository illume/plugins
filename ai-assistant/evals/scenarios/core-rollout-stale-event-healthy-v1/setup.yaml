apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
---
apiVersion: events.k8s.io/v1
kind: Event
metadata:
  name: web-old-failure
eventTime: '2025-01-01T00:00:00Z'
action: Pulling
reason: Failed
note: Earlier rollout could not pull its image.
regarding:
  apiVersion: apps/v1
  kind: Deployment
  name: web
  uid: stale-generation
reportingController: headlamp-evals
reportingInstance: phase-2-anchor
type: Warning
