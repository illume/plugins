spec:
  replicas: 1
  selector:
    matchLabels:
      app: object-finding-22
  template:
    metadata:
      labels:
        app: object-finding-22
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          ports:
            - containerPort: 8080
