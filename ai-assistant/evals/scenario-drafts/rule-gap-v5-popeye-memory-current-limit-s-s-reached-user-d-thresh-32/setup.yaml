apiVersion: apps/v1
kind: Deployment
metadata:
  name: object-finding-32
spec:
  replicas: 1
  selector:
    matchLabels:
      app: object-finding-32
  template:
    metadata:
      labels:
        app: object-finding-32
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 100m
              memory: 100Mi
            limits:
              cpu: 100m
              memory: 100Mi
---
apiVersion: metrics.k8s.io/v1beta1
kind: PodMetrics
metadata:
  name: object-finding-32-pod
containers:
  - name: app
    usage:
      cpu: 50m
      memory: 95Mi
