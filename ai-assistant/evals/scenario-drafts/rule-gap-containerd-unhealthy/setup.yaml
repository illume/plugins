apiVersion: batch/v1
kind: Job
metadata:
  name: containerd-health-probe
spec:
  activeDeadlineSeconds: 120
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: containerd-health-probe
    spec:
      restartPolicy: Never
      containers:
        - name: probe
          image: busybox:1.36.1
          command:
            - /bin/sh
            - '-c'
            - >-
              wget -q -T 2 -O /dev/null http://127.0.0.1:65531/healthz || { echo 'containerd health
              check failed: endpoint unavailable'; exit 32; }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
