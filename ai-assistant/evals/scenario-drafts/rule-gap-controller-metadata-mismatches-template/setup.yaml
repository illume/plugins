apiVersion: apps/v1
kind: Deployment
metadata:
  name: metadata-mismatch
  labels:
    app: public-name
spec:
  replicas: 2
  selector:
    matchLabels:
      app: metadata-mismatch
  template:
    metadata:
      labels:
        app: metadata-mismatch
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
