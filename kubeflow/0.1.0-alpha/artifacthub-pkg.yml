version: 0.1.0-alpha
name: "headlamp_kubeflow"
displayName: Kubeflow
createdAt: "2026-04-14T10:19:00Z"
logoURL: "https://raw.githubusercontent.com/kubeflow/manifests/refs/heads/master/common/oauth2-proxy/base/kubeflow-logo.svg"
description: A UI for viewing and managing Kubeflow resources in Headlamp.
changes:
  - kind: added
    description: "Initial release of the Headlamp plugin for Kubeflow."
  - kind: added
    description: "Auto-detect installed Kubeflow components by probing cluster CRDs."
  - kind: added
    description: "Notebooks support: Notebook, Profile, and PodDefault resources (kubeflow.org/v1)."
  - kind: added
    description: "Notebook log viewer in detail side-pane."
  - kind: added
    description: "Pipelines support: Pipeline and PipelineVersion resources (pipelines.kubeflow.org/v2beta1)."
  - kind: added
    description: "Katib / AutoML support: Experiment, Trial, and Suggestion resources (kubeflow.org/v1beta1)."
  - kind: added
    description: "Training Operators support: TrainJob, TrainingRuntime, and ClusterTrainingRuntime resources (trainer.kubeflow.org/v1alpha1)."
  - kind: added
    description: "Spark Operators support: SparkApplication and ScheduledSparkApplication resources (sparkoperator.k8s.io/v1beta2)."
  - kind: added
    description: "Overview dashboard with status evaluation utilities."
  - kind: added
    description: "Shared badge and section page components."
  - kind: added
    description: "Storybook stories and mock data fixtures."
annotations:
  headlamp/plugin/archive-url: "https://github.com/headlamp-k8s/plugins/releases/download/kubeflow-0.1.0-alpha/headlamp-k8s-kubeflow-0.1.0-alpha.tar.gz"
  headlamp/plugin/archive-checksum: "SHA256:TBD"
  headlamp/plugin/version-compat: ">=0.22"
  headlamp/plugin/distro-compat: "in-cluster,web,docker-desktop,desktop"
