apiVersion: v1
kind: ConfigMap
metadata:
  name: npd-cper-corrected-fixture
  labels:
    evals.kubernetes.io/fixture-kind: node-log
  annotations:
    evals.kubernetes.io/adapter: disposable-node
    evals.kubernetes.io/target-path: /dev/kmsg
    evals.kubernetes.io/apply-to-current-host: 'false'
data:
  source.log: 'mce: [Hardware Error]: event severity: corrected'
  normalized-message.txt: 'mce: [Hardware Error]: event severity: corrected'
  oracle.json: >-
    {"source":"kernel-monitor","regex":".*\\[Hardware Error\\]: event severity:
    corrected$","requiredMatches":1}
  healthy-control.log: 'mce: hardware event polling enabled'
