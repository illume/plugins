apiVersion: v1
kind: Pod
metadata:
  name: config-reference-probe
spec:
  activeDeadlineSeconds: 120
  restartPolicy: Never
  containers:
    - name: app
      image: busybox:1.36.1
      command:
        - /bin/sh
        - '-c'
        - exit 0
      env:
        - name: REQUIRED_SETTING
          valueFrom:
            configMapKeyRef:
              name: missing-runtime-config
              key: setting
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        runAsNonRoot: true
        runAsUser: 1000
