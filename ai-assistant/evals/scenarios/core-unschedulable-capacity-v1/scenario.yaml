title: Pod requests more CPU than any eligible node can provide
description: >
  A single Pod requests one million CPU, so no node in the dedicated cluster
  can place it. Scored truth
  depends on an actual scheduler decision, which the simulated in-memory
  adapter cannot independently prove (see contracts/kwokCompatibility.ts);
  this scenario supports the `local-minikube` and `aks` profiles.
