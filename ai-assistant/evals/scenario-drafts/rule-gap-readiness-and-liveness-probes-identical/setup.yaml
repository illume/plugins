apiVersion: v1
kind: Pod
metadata:
  name: identical-probes
  labels:
    app: identical-probes
spec:
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 65532
      readinessProbe:
        httpGet:
          path: /healthz
          port: 8080
        periodSeconds: 10
      livenessProbe:
        httpGet:
          path: /healthz
          port: 8080
        periodSeconds: 10
