apiVersion: apps/v1
kind: Deployment
metadata:
  name: deprecated-identity
spec:
  replicas: 1
  selector:
    matchLabels:
      app: deprecated-identity
  template:
    metadata:
      labels:
        app: deprecated-identity
    spec:
      serviceAccount: legacy-identity
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
