apiVersion: v1
kind: Pod
metadata:
  name: cpu-request-limit-differ
  labels:
    app: cpu-request-limit-differ
spec:
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 65532
      resources:
        requests:
          cpu: 100m
        limits:
          cpu: 500m
