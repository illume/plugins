family: scheduling
mode: diagnose_only
title: Pending Pod with intentionally withheld decisive evidence
description: >
  A Pod is visible in Pending phase, but the decisive scheduler/node evidence
  needed to name a unique cause is intentionally unavailable. The correct
  behavior is bounded uncertainty (at least two remaining hypotheses) or safe
  escalation — a unique root-cause claim here is a failure. Like
  core-unschedulable-capacity-v1, this depends on a real scheduler decision
  and is declared for the `aks` profile only.
