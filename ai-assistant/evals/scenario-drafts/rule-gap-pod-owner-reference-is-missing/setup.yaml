apiVersion: v1
kind: Pod
metadata:
  name: orphan-owner-pod
  labels:
    app: orphan-owner-pod
  ownerReferences:
    - apiVersion: apps/v1
      kind: ReplicaSet
      name: missing-owner
      uid: 00000000-0000-4000-8000-000000000018
      controller: true
spec:
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 65532
