title: Service selector does not match any running Pod (variant 11)
description: >-
  A Service named "web" exists alongside a Running Pod labeled app=web, but the Service's selector
  requires tier=frontend while the Pod is labeled tier=backend, so the EndpointSlice has zero
  addresses. The candidate must diagnose the selector mismatch using only observations it actually
  retrieves. Reviewed variant 11 adds 2 benign fixture distractor(s).
