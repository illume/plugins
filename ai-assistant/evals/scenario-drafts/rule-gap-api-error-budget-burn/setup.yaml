apiVersion: v1
kind: Service
metadata:
  name: burn-api-backend
spec:
  selector:
    app: intentionally-absent-api-backend
  ports:
    - name: https
      port: 443
      targetPort: 8443
---
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1alpha1.burn.telemetry.example
spec:
  group: burn.telemetry.example
  version: v1alpha1
  groupPriorityMinimum: 100
  versionPriority: 100
  insecureSkipTLSVerify: true
  service:
    name: burn-api-backend
    port: 443
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-error-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-error-generator
  template:
    metadata:
      labels:
        app: api-error-generator
    spec:
      containers:
        - name: requester
          image: registry.k8s.io/e2e-test-images/busybox:1.29-4
          command:
            - /bin/sh
            - '-c'
            - >-
              TOKEN=$(cat /var/run/secrets/kubernetes.io/serviceaccount/token); while true; do wget
              -q -O /dev/null --no-check-certificate --header="Authorization: Bearer $TOKEN"
              https://kubernetes.default.svc/apis/burn.telemetry.example/v1alpha1 || true; sleep 1;
              done
