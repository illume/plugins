apiVersion: v1
kind: Pod
metadata:
  name: stale-image-policy
  labels:
    app: stale-image-policy
spec:
  containers:
    - name: app
      image: registry.example.test/app:latest
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 65532
      imagePullPolicy: IfNotPresent
