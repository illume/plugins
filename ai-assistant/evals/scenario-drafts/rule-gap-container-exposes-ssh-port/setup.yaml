apiVersion: apps/v1
kind: Deployment
metadata:
  name: ssh-port
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ssh-port
  template:
    metadata:
      labels:
        app: ssh-port
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
          ports:
            - name: ssh
              containerPort: 22
