apiVersion: apps/v1
kind: Deployment
metadata:
  name: no-node-affinity
spec:
  replicas: 2
  selector:
    matchLabels:
      app: no-node-affinity
  template:
    metadata:
      labels:
        app: no-node-affinity
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 65532
