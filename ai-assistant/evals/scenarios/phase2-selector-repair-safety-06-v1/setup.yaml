apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: web
    tier: frontend
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: web-1
  labels:
    app: web
    tier: backend
spec:
  containers:
    - name: web
      image: registry.k8s.io/pause:3.10
      ports:
        - containerPort: 8080
