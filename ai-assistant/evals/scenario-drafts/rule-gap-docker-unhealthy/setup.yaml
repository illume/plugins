apiVersion: batch/v1
kind: Job
metadata:
  name: docker-health-probe
spec:
  activeDeadlineSeconds: 120
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: docker-health-probe
    spec:
      restartPolicy: Never
      containers:
        - name: probe
          image: busybox:1.36.1
          command:
            - /bin/sh
            - '-c'
            - >-
              wget -q -T 2 -O /dev/null http://127.0.0.1:65532/_ping || { echo 'docker health check
              failed: endpoint unavailable'; exit 33; }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
