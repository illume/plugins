apiVersion: batch/v1
kind: Job
metadata:
  name: database-process-spawns-shell
  labels:
    evals.kubernetes.io/bounded-action: 'true'
spec:
  activeDeadlineSeconds: 120
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: database-process-spawns-shell
    spec:
      restartPolicy: Never
      containers:
        - name: action
          image: python:3.12-alpine
          command:
            - /bin/sh
            - '-ceu'
            - >-
              cp /usr/local/bin/python3 /fixture/mysqld; /fixture/mysqld -c 'import subprocess;
              subprocess.run(["/bin/sh","-c","echo database-child-shell"], check=True)'
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: fixture
              mountPath: /fixture
            - name: device-fixture
              mountPath: /dev/fixture
      volumes:
        - name: fixture
          emptyDir:
            sizeLimit: 16Mi
        - name: device-fixture
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
