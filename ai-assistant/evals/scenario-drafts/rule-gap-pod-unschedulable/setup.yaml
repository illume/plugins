apiVersion: v1
kind: Pod
metadata:
  name: capacity-probe
spec:
  activeDeadlineSeconds: 120
  restartPolicy: Never
  containers:
    - name: app
      image: busybox:1.36.1
      command:
        - /bin/sh
        - '-c'
        - exit 0
      resources:
        requests:
          cpu: '100000'
          memory: 1Mi
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        runAsNonRoot: true
        runAsUser: 1000
