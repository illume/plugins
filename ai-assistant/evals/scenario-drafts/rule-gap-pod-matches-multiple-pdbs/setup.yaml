apiVersion: v1
kind: Pod
metadata:
  name: multiply-protected
  labels:
    app: multiply-protected
spec:
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10
      securityContext:
        allowPrivilegeEscalation: false
        runAsNonRoot: true
        runAsUser: 65532
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pdb-a
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: multiply-protected
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pdb-b
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: multiply-protected
