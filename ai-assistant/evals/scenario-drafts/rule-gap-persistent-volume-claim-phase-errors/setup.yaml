apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pending-claim
spec:
  storageClassName: telemetry-missing-provisioner
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: pending-claim-consumer
spec:
  containers:
    - name: app
      image: registry.k8s.io/pause:3.10
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: pending-claim
