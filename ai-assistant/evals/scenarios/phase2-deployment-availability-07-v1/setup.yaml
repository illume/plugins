apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: pause
          image: registry.k8s.io/pause:3.10
---
apiVersion: events.k8s.io/v1
kind: Event
metadata:
  name: web-old-failure
eventTime: '2025-01-01T00:00:00.000000Z'
action: Pulling
reason: Failed
note: Earlier rollout could not pull its image.
regarding:
  apiVersion: apps/v1
  kind: Deployment
  name: web
  namespace: __EVAL_NAMESPACE__
  uid: stale-generation
reportingController: headlamp-evals
reportingInstance: phase-2-anchor
type: Warning

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: draft-distractor-1
  labels:
    evals.headlamp.dev/variant: phase2-deployment-availability-07-v1
data:
  note: "Benign qualification distractor 1 for phase2-deployment-availability-07-v1"
