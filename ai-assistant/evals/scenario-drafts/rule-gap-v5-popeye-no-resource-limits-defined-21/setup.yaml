apiVersion: apps/v1
kind: Deployment
metadata:
  name: object-finding-21
spec:
  replicas: 1
  selector:
    matchLabels:
      app: object-finding-21
  template:
    metadata:
      labels:
        app: object-finding-21
    spec:
      containers:
        - name: app
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
