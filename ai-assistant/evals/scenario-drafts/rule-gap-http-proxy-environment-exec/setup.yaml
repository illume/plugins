apiVersion: batch/v1
kind: Job
metadata:
  name: http-proxy-environment-exec
  labels:
    evals.kubernetes.io/bounded-action: 'true'
spec:
  activeDeadlineSeconds: 120
  backoffLimit: 0
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: http-proxy-environment-exec
    spec:
      restartPolicy: Never
      containers:
        - name: action
          image: registry.k8s.io/e2e-test-images/busybox:1.29-4
          command:
            - /bin/sh
            - '-ceu'
            - HTTP_PROXY=http://127.0.0.1:9 /bin/sh -c "printf proxy-env-exec"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
          volumeMounts:
            - name: fixture
              mountPath: /fixture
            - name: device-fixture
              mountPath: /dev/fixture
      volumes:
        - name: fixture
          emptyDir:
            sizeLimit: 16Mi
        - name: device-fixture
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
